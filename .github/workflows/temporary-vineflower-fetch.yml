name: Temporary Vineflower Fetch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and encode Vineflower
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/vineflower-1.12.0.jar \
            https://repo.maven.apache.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar
          test -s /tmp/vineflower-1.12.0.jar
          mkdir -p .github/vineflower-payload
          rm -f .github/vineflower-payload/chunk.*
          sha256sum /tmp/vineflower-1.12.0.jar > .github/vineflower-payload/SHA256SUMS.txt
          base64 -w0 /tmp/vineflower-1.12.0.jar | split -b 700000 - .github/vineflower-payload/chunk.
      - name: Commit encoded payload
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/vineflower-payload
          git commit -m 'ci: store temporary Vineflower payload'
          git push
