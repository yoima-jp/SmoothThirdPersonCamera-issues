name: Temporary Vineflower Fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/vineflower-trigger.txt'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Vineflower
        run: |
          curl --fail --location --retry 3 \
            --output vineflower-1.12.0.jar \
            https://repo.maven.apache.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar
          test -s vineflower-1.12.0.jar
          sha256sum vineflower-1.12.0.jar
      - name: Upload decompiler
        uses: actions/upload-artifact@v4
        with:
          name: vineflower-1.12.0
          path: vineflower-1.12.0.jar
          if-no-files-found: error
          retention-days: 1
